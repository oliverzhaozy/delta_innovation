<section class="card">
  <h2>Confirmed duties on these dates</h2>
  {% if duty_rows %}
  <ul class="toollist">
    {% for d in duty_rows %}
    <li><span class="muted">{{ d.date.strftime("%a %d %b") }}</span>
        <span>{{ d.duty.label }} — confirmed</span></li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">No confirmed duties on these dates.</p>
  {% endif %}
</section>
