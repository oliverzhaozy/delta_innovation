{# The parade section's one-tap workflow strip. `active` names the current
   surface. Each page is fixed to its operational date, so the pills are plain
   links — no date param to carry. #}
<nav class="pills" aria-label="Parade pages">
  <a href="{{ url_for('parade.cos_message') }}" {% if active == "cos" %}class="active" aria-current="page"{% endif %}>COS message</a>
  <a href="{{ url_for('parade.roll_call') }}" {% if active == "roll_call" %}class="active" aria-current="page"{% endif %}>Roll call</a>
  <a href="{{ url_for('parade.morning') }}" {% if active == "morning" %}class="active" aria-current="page"{% endif %}>Morning parade state</a>
</nav>
